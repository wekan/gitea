name: Release All

# Build every file upstream go-gitea/gitea puts on a release - the binaries of
# every platform in tools/build-release.sh, their .xz, the source tarball, a
# .sha256 and a keyless cosign signature of each - and attach them to a GitHub
# Release of wekan/gitea, replacing files of the same name.
#
# Upstream's own release-tag-version.yml is left as it is: it needs a
# self-hosted runner and storage credentials this fork does not have, and
# every line changed in an upstream file is a merge conflict later. The build
# is in release-all-build.yml.
#
# Usage:
#   gh workflow run release-all.yml                      # v<upstream version>-wekan-<date>-<commit>
#   gh workflow run release-all.yml -f tag=v29.0.0-wekan-20261107-e5341b4
#
# To fill in only what a release is missing, use release-all-missing.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, with no "v" after the first character (empty = v<upstream version>-wekan-<date>-<commit>)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: gitea-release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-all-build.yml
    with:
      mode: all
      tag: ${{ inputs.tag }}
